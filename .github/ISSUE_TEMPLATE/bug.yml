name: Bug
description: The website shows something wrong or broken. Bugs in the skill or an installer go to homeport-skill.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This tracker is for the website only. If the skill or an installer did something wrong, open the issue at https://github.com/antongavrilov88/homeport-skill/issues instead.
  - type: input
    id: where
    attributes:
      label: Where on the page
      placeholder: the free card, the comparison, the header
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected. A screenshot helps. If a claim about the skill is wrong, say which one and link the code that shows it.
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser, device and theme
      placeholder: Safari on iPhone, 390 px wide, dark
