# Checks for the Burrow site: no secrets, region-neutral wording, no leftover placeholders.
name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in the tree
        run: |
          ! grep -rnE 'dop_v1_[A-Za-z0-9]{20,}|tk_[a-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE' --exclude-dir=.git . || (echo "possible secret committed" && exit 1)
      - name: No country-specific wording
        run: bash .github/wording-guard.sh
      - name: No placeholders on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          ! grep -rn '{{[A-Z_]*}}' README.md SECURITY.md docs/ .github/ISSUE_TEMPLATE/ || (echo "fill the placeholders before main" && exit 1)
